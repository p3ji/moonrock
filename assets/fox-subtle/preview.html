<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moonrock — subtle three-tail fox</title><style>@font-face{font-family:Story;src:url('../fonts/cormorant.woff2')}*{box-sizing:border-box}body{margin:0;background:#151c35;color:#f1e8d5;font:13px system-ui,sans-serif}header{max-width:1000px;margin:auto;padding:25px;display:flex;align-items:center;justify-content:space-between;gap:25px}h1{font:italic 36px Story,Georgia,serif;margin:0}p{font-size:12px;color:#c9b78d;line-height:1.7}button{background:transparent;color:inherit;border:1px solid #b89e68;padding:12px 18px;cursor:pointer;min-height:44px}main{max-width:850px;margin:auto}.scene{position:relative;width:100%;aspect-ratio:1312/1280}.original{position:absolute;top:0;left:0;width:100%;height:auto;z-index:1}.extra-tails{position:absolute;left:68%;top:64%;width:27%;height:30%;object-fit:contain;transform:rotate(-12deg);z-index:0}.scene.original-only .extra-tails{visibility:hidden}.note{max-width:900px;margin:20px auto 40px;padding:0 25px}.cream{background:#f1e8d5;color:#302e40}.cream p{color:#716246}.controls{display:flex;gap:10px;flex-wrap:wrap}@media(max-width:600px){header{display:block}h1{font-size:32px}.controls{margin-top:18px}main{padding:0 10px}}</style></head><body><header><div><h1>A quieter three-tail fox.</h1><p>Original illustration + two tucked-away tail tips.</p></div><div class="controls"><button id="compare" aria-pressed="false">Show original only</button><button id="background">Cream background</button></div></header><main><div class="scene" role="img" aria-label="The original sleeping silver fox on its golden crescent, with two subtle extra tails tucked behind"><img class="extra-tails" src="extra-tails.webp" alt=""><img class="original" src="../storybook-source.png" alt=""></div></main><p class="note">The original image is the unchanged front layer. Only the two small tail tips are new. This is a separate review candidate; the live site hasn’t changed.</p><script>document.querySelector('#compare').onclick=e=>{const original=document.querySelector('.scene').classList.toggle('original-only');e.target.textContent=original?'Show subtle extra tails':'Show original only';e.target.setAttribute('aria-pressed',original)};document.querySelector('#background').onclick=e=>{const cream=document.body.classList.toggle('cream');e.target.textContent=cream?'Blue background':'Cream background'};</script></body></html>
